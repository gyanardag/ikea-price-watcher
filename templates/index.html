<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKEA EU Price Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div class="max-w-5xl mx-auto py-12 px-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 mb-10 border border-slate-100">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-black text-blue-800 mb-2 italic uppercase">IKEA Price Watcher</h1>
                <p class="text-slate-400 font-medium tracking-widest text-xs">EU PRICE COMPARISON ENGINE (MULTI-LANGUAGE SUPPORT)</p>
            </div>
            
            <div class="flex flex-col md:flex-row gap-4 mb-10">
                <input type="text" id="productId" placeholder="Enter Product ID (e.g. 905.915.88)" 
                       class="flex-1 border-2 border-slate-100 p-5 rounded-2xl focus:border-blue-500 outline-none transition-all text-lg font-medium">
                <button onclick="comparePrices()" id="searchBtn"
                        class="bg-blue-700 hover:bg-blue-800 text-white px-10 py-5 rounded-2xl font-black transition-all shadow-lg active:scale-95 text-lg uppercase">
                    Track Price
                </button>
            </div>

            <div id="loading" class="hidden flex flex-col items-center py-16">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-700 mb-6"></div>
                <p class="text-slate-600 font-bold italic">Browsing EU stores (Translating FR to English)...</p>
            </div>

            <div id="resultContent" class="hidden space-y-10">
                
                <div class="flex flex-col md:flex-row items-center gap-8 bg-slate-50/50 p-6 rounded-3xl border border-slate-100">
                    <div id="productImgContainer" class="w-40 h-40 bg-white rounded-2xl overflow-hidden flex-shrink-0 border-4 border-white shadow-md">
                        <img id="prodImage" src="" alt="Product" class="w-full h-full object-contain hidden">
                        <div id="imgPlaceholder" class="w-full h-full flex items-center justify-center text-slate-300 font-bold italic">No Photo</div>
                    </div>
                    <div class="text-center md:text-left">
                        <span class="bg-blue-100 text-blue-700 text-[10px] font-black px-3 py-1 rounded-full uppercase mb-2 inline-block">Product Identified</span>
                        <h2 id="prodName" class="text-3xl font-black text-slate-800 tracking-tight leading-none mb-2">Product Name</h2>
                        <p class="text-slate-400 text-sm italic">Showing English names retrieved from NL/BE/DE databases.</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-4 gap-5" id="cardsContainer"></div>

                <div class="bg-white p-8 rounded-3xl border-2 border-slate-50">
                    <h3 class="text-xl font-black text-slate-800 mb-6 flex items-center gap-2">
                        <span class="w-2 h-6 bg-blue-600 rounded-full"></span>
                        Market Price Analysis
                    </h3>
                    <div class="h-80">
                        <canvas id="priceChart"></canvas>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let myChart = null;

        async function comparePrices() {
            const itemId = document.getElementById('productId').value;
            if(!itemId) return alert("Please enter a code.");
            const loading = document.getElementById('loading');
            const content = document.getElementById('resultContent');
            loading.classList.remove('hidden');
            content.classList.add('hidden');

            try {
                const response = await fetch('/compare', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({item_id: itemId})
                });
                const data = await response.json();
                renderResults(data);
            } catch (error) {
                alert("Server connection error.");
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderResults(data) {
            const content = document.getElementById('resultContent');
            const cardsContainer = document.getElementById('cardsContainer');
            const prodImage = document.getElementById('prodImage');
            const imgPlaceholder = document.getElementById('imgPlaceholder');
            content.classList.remove('hidden');

            const firstValid = Object.values(data).find(d => d.name !== "-");
            document.getElementById('prodName').innerText = firstValid ? firstValid.name : "IKEA Product";
            
            if (firstValid && firstValid.image) {
                prodImage.src = firstValid.image;
                prodImage.classList.remove('hidden');
                imgPlaceholder.classList.add('hidden');
            }

            const countries = ['BE', 'NL', 'FR', 'DE'];
            const chartData = countries
                .map(code => ({
                    code: code,
                    price: data[code].price,
                    display: data[code].display_price
                }))
                .filter(item => item.price !== null)
                .sort((a, b) => a.price - b.price);

            cardsContainer.innerHTML = '';
            countries.forEach(code => {
                const item = data[code];
                const card = `
                    <a href="${item.url}" target="_blank" 
                       class="group bg-white p-6 rounded-2xl border-2 border-slate-100 shadow-sm text-center hover:border-blue-600 hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                        <span class="text-[10px] font-black text-slate-300 uppercase">${code} ${code==='FR' ? '(FR)' : '(EN)'}</span>
                        <div class="text-3xl font-black mt-2 ${item.status === 'error' ? 'text-red-400' : 'text-slate-800 group-hover:text-blue-700'}">
                            ${item.display_price}
                        </div>
                        <div class="text-[9px] font-bold mt-3 text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity uppercase tracking-widest">Visit Store ↗</div>
                    </a>
                `;
                cardsContainer.innerHTML += card;
            });

            updateChart(chartData);
        }

        function updateChart(sortedData) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            const colors = ['#22c55e', '#eab308', '#f97316', '#ef4444'];
            const labels = sortedData.map(d => d.code);
            const values = sortedData.map(d => d.price);
            const backgroundColors = sortedData.map((_, index) => colors[index] || '#94a3b8');

            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Price in €',
                        data: values,
                        backgroundColor: backgroundColors,
                        borderRadius: 12,
                        barThickness: 50
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>
